<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Chat with Harsh Gohil's portfolio assistant: projects, skills, experience and contact." />
  <title>Harsh's Assistant</title>
  <script>
    /* Theme before first paint. ?theme=light|dark from the parent page wins, then saved choice. */
    (function () {
      var t = null;
      try { t = new URLSearchParams(location.search).get('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') { try { t = localStorage.getItem('hg-theme'); } catch (e) {} }
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      if (window.self !== window.top) document.documentElement.classList.add('is-embed');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="chat.css?v=2" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow g1" aria-hidden="true"></div>
  <div class="bg-glow g2" aria-hidden="true"></div>

  <main class="app" id="app">
    <!-- 3D orb: one canvas that lives big in the hero, then docks into the header -->
    <div class="orb" id="orb" aria-hidden="true">
      <canvas id="orbCanvas"></canvas>
      <div class="orb-fallback"></div>
    </div>

    <header class="head">
      <div class="head-orb-slot" aria-hidden="true"></div>
      <div class="head-info">
        <p class="head-name">Harsh's Assistant</p>
        <p class="head-status"><span class="dot-online"></span><span id="statusText">Online · replies instantly</span></p>
      </div>
      <div class="head-actions">
        <button class="icon-btn" id="themeBtn" aria-label="Theme: Auto" title="Theme">
          <svg class="i-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
          <svg class="i-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn" id="resetBtn" aria-label="Restart conversation" title="Restart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="icon-btn embed-only" id="closeBtn" aria-label="Close chat" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </header>

    <section class="scroll" id="scroll">
      <div class="hero" id="hero">
        <div class="hero-orb-slot" aria-hidden="true"></div>
        <span class="hero-label">AI portfolio assistant</span>
        <h1 class="hero-title">Hey, I'm <span class="hl">Harsh's</span> bot.</h1>
        <p class="hero-sub">Ask about his projects, stack, experience, or how to hire him. Real answers, no fluff.</p>
        <button class="demo-banner" data-action="demos">
          <span class="demo-banner-play" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
          <span class="demo-banner-txt"><b>Watch live demos</b><small>11 real product recordings · Qlik bots + Data Access Auditor</small></span>
          <span class="demo-banner-arrow" aria-hidden="true">→</span>
        </button>
        <div class="quick" id="quick">
          <button class="quick-tile" data-action="about"><span class="qi">👋</span><b>About</b><small>Who is Harsh?</small></button>
          <button class="quick-tile" data-action="projects"><span class="qi">🚀</span><b>Projects</b><small>14 shipped</small></button>
          <button class="quick-tile" data-action="skills"><span class="qi">⚡</span><b>Stack</b><small>Node · AWS · Qlik</small></button>
          <button class="quick-tile" data-action="experience"><span class="qi">💼</span><b>Experience</b><small>8+ years</small></button>
          <button class="quick-tile" data-action="resume"><span class="qi">📄</span><b>Resume</b><small>PDF download</small></button>
          <button class="quick-tile" data-action="contact"><span class="qi">✉️</span><b>Contact</b><small>Let's talk</small></button>
        </div>
        <div class="hero-more">
          <button class="chip" data-action="interview">🧠 Take the quiz</button>
          <button class="chip" data-action="faq">FAQ</button>
          <button class="chip" data-action="github">GitHub</button>
          <button class="chip" data-action="architecture">How I'm built</button>
        </div>
      </div>
      <div class="log" id="log" role="log" aria-live="polite" aria-label="Conversation"></div>
    </section>

    <footer class="foot">
      <div class="suggest" id="suggest" aria-label="Suggestions"></div>
      <form class="composer" id="composer" autocomplete="off">
        <input id="input" type="text" maxlength="300" placeholder="Ask me anything…" aria-label="Message" enterkeyhint="send" />
        <button type="submit" class="send" id="sendBtn" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <p class="foot-note">Built by Harsh on Node.js + Bot Framework · <a href="https://github.com/iharsh220" target="_blank" rel="noopener">GitHub</a></p>
    </footer>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
  <script src="chat.js?v=2" defer></script>
</body>
</html>
